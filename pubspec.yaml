name: dio_mcache
description: >-
  HTTP cache interceptor for Dio built on mcache_dart. Per-request
  cache policies, tag invalidation, deduplication, conditional
  requests, and stale-while-revalidate.
version: 0.1.4
repository: https://github.com/PurpleSoftSrl/dio_mcache
topics:
  - dio
  - cache
  - caching
  - http
  - flutter

environment:
  sdk: ^3.4.0

dependencies:
  dio: ^5.7.0
  mcache_dart: ^0.1.9

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
